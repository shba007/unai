name: 'unai-dev'
services:
  web:
    # image: 'ghcr.io/shba007/unai-web:latest'
    build: ./docs
    restart: on-failure:3
    env_file:
      - ./docs/.env.prod
    ports:
      - 3200:8000

  api:
    # image: 'ghcr.io/shba007/unai-api:latest'
    build: ../unai-api
    restart: on-failure:3
    env_file:
      - ../unai-api/.env.prod
    ports:
      - 2300:8000

  scout:
    # image: 'ghcr.io/shba007/unai-api:latest'
    build: ../unai-scout
    restart: on-failure:3
    env_file:
      - ../unai-scout/.env.prod
    ports:
      - 2310:4200

  prefect-server:
    image: prefecthq/prefect:3.2-python3.12
    restart: on-failure:3
    ports:
      - '1410:4200'
    environment:
      PREFECT_API_URL: 'http://localhost:1410/api'
      PREFECT_SERVER_API_HOST: '0.0.0.0'
      PREFECT_API_DATABASE_CONNECTION_URL: 'postgresql+asyncpg://postgres:postgres@postgres:5432/main'
      PREFECT_API_DATABASE_MIGRATE_ON_START: True
    command: ['prefect', 'server', 'start']

  open-webui:
    image: ghcr.io/open-webui/open-webui:main@sha256:1a6399d237dc392a2313e0ca826020b3fd5d22536357840eb63393d18dc8b924
    restart: on-failure:3
    ports:
      - 1101:8080
    environment:
      - OLLAMA_BASE_URL=http://ollama:9090
    volumes:
      - open-webui:/app/backend/data

  ollama:
    image: ollama/ollama:0.13.3-rocm@sha256:e49d21dfbf72b5fea88b512c83d41764de462b3efd059f625d3a1d2a855852ed
    restart: on-failure:3
    ports:
      - 1100:11434
    volumes:
      - ../unai-models/models/ollama:/root/.ollama

  invokeai:
    image: ghcr.io/invoke-ai/invokeai:6.9-cpu
    restart: on-failure:3
    ports:
      - 1110:9090
    # runtime: nvidia
    # deploy:
    #     resources:
    #         reservations:
    #             devices:
    #                 - driver: nvidia
    #                   count: all
    #                   capabilities:
    #                       - gpu
    volumes:
      - ../unai-models/models/invokeai:/app/invokeai

  imagebind:
    image: r8.im/daanelson/imagebind@sha256:0383f62e173dc821ec52663ed22a076d9c970549c209666ac3db181618b7a304
    restart: on-failure:3
    ports:
