    restart: on-failure:3
    ports:
      - 1310:8500
      - 1311:8501
    volumes:
      - type: bind
        source: ../unai-models/dist/models
        target: /models
    command: '--model_config_file=/models/models.config'

  torchserve:
    image: pytorch/torchserve:0.12.0-cpu@sha256:50e189492f630a56214dce45ec6fd8db3ad45845890c0e8c26b469c6b06ca4fe
    restart: on-failure:3
    ports:
      - 1320:8080
      - 1321:8081
      - 1322:8082
      - 1323:7070
      - 1324:7071
    volumes:
      - type: bind
        source: ../unai-models/dist/models
        target: /home/model-server/model-store
    command: torchserve --model-store /home/model-server/model-store --models my_model=TranslationClassifier.mar

  postgres:
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    command: '-d 1'
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=main
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
  open-webui:
